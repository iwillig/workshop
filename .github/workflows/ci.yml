name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Install Pipenv
        run: python -m pip install pipenv
      - name: Install dependencies
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
        run: |
          pipenv sync --dev
          pipenv run python -m pip install --no-deps -e .
      - name: Lint
        run: pipenv run ruff check . --config pyproject.toml
      - name: Check formatting
        run: pipenv run ruff format --check . --config pyproject.toml
      - name: Run tests
        run: pipenv run python -m pytest tests
