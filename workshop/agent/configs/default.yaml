# Default configuration for `workshop agent run`.
# Copy this file and pass your copy with `workshop agent run -c my-config.yaml`.
# Prompt templates (system_template, instance_template, ...) default to
# workshop.agent.prompts when omitted; set them here to override.
agent:
  agent_class: interactive
  mode: confirm
  step_limit: 50
environment:
  environment_class: local
  timeout: 30
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"
model:
  model_class: llm
  model_name: null
  model_options: {}
