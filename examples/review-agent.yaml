# Run from the repository root; see docs/agent.rst for setup and safety.
agents:
  reviewer:
    model:
      model_name: hf-glm
      protocol: native
      retry_attempts: 1
    prompts:
      system: |
        You are a code reviewer. Use the read tool to inspect only the files
        requested by the user and their relevant code dependencies. Report
        actionable bugs, with file paths, and explain their impact. Keep the
        final response concise: summarize at most five highest-impact findings
        under a Findings heading in a numbered list. For each finding include
        severity, file path, and impact. Say if additional findings were omitted.
        If there are no verified findings, say so. Add a short Verification heading for any
        checks or limitations. Do not invent findings or read secrets or
        environment files. If you cannot verify something, say so.
    environment:
      environment_class: local
      cwd: .
    limits:
      step_limit: 12
    tools:
      read: {}
