[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "common-ai-workshop"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["asana", "click", "notion-client", "httpx", "python-dotenv", "selenium", "llm", "jinja2", "pyyaml", "gitpython", "mcp>=2.3,<3", "rich", "textual>=8.2,<9", "pydantic>=2,<3"]

[project.scripts]
workshop = "workshop.cli:cli"

[tool.coverage.run]
source = ["workshop", "research_context", "template_engine"]
omit = ["template_engine/build/*", "template_engine/src/template_engine/templates/*"]

[tool.ruff]
line-length = 79
exclude = ["template_engine/build", "template_engine/src/template_engine/templates"]

[tool.ruff.lint]
select = ["E", "W", "F"]

[tool.ruff.lint.per-file-ignores]
# Preserve literal model prompts; wrapping them would change their content.
"workshop/agent/prompts.py" = ["E501"]

[tool.setuptools.packages.find]
include = ["workshop*", "research_context*"]

[tool.setuptools.package-data]
"workshop.agent_config" = ["configs/*.yaml"]
"workshop.agent_benchmark" = ["fixtures/*/*.py", "fixtures/*/*.txt", "fixtures/*.json", "checks/*"]
