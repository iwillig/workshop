[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "common-ai-workshop"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["asana", "click"]

[project.scripts]
workshop = "workshop.cli:cli"

[tool.setuptools.packages.find]
include = ["workshop", "research_context"]
