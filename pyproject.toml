[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "common-ai-workshop"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["asana", "click", "notion-client", "httpx", "python-dotenv", "selenium", "llm", "jinja2", "pyyaml"]

[project.scripts]
workshop = "workshop.cli:cli"

[tool.ruff]
exclude = ["template-engine/build", "template-engine/src/template_engine/templates"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
include = ["workshop*", "research_context*"]

[tool.setuptools.package-data]
"workshop.agent" = ["configs/*.yaml"]
